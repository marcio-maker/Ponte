<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HairOS · referência & IA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #faf9f8;
      color: #1e1e1e;
      line-height: 1.5;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app { max-width: 460px; width: 100%; margin: 0 auto; }

    .header { margin-bottom: 1.5rem; text-align: center; }
    .header h1 { font-size: 1.7rem; font-weight: 500; letter-spacing: -0.02em; }
    .header p { font-size: 0.9rem; color: #6b6b6b; margin-top: 0.2rem; }

    /* ---------- GALERIA ---------- */
    .gallery { display: flex; flex-direction: column; gap: 1.2rem; }

    .hair-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      border: 1px solid #f0efed;
      transition: transform 0.15s ease;
    }
    .hair-card:active { transform: scale(0.99); }
    .hair-card img {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      display: block; background: #eae8e6;
    }
    .hair-card-info { padding: 0.9rem 1rem 1rem; }
    .hair-card-info h2 { font-size: 1.15rem; font-weight: 500; margin-bottom: 0.15rem; }
    .hair-card-info p { font-size: 0.85rem; color: #6b6b6b; }

    /* ---------- MODAL QR ---------- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; z-index: 1000;
      visibility: hidden; opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }

    .modal-content {
      background: white; border-radius: 32px;
      max-width: 420px; width: 100%;
      padding: 1.2rem 1.2rem 1.5rem;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
    }

    .modal-close {
      position: absolute; top: 12px; right: 16px;
      background: rgba(0, 0, 0, 0.06); border: none;
      width: 36px; height: 36px; border-radius: 30px;
      font-size: 1.4rem; cursor: pointer; color: #333;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: rgba(0, 0, 0, 0.12); }

    .modal-hair-img {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 20px; margin-bottom: 1rem; background: #eae8e6;
    }
    .modal-hair-name { font-size: 1.35rem; font-weight: 500; margin-bottom: 0.25rem; }
    .modal-hair-desc { font-size: 0.9rem; color: #5a5a5a; margin-bottom: 1rem; }

    .qrcode-section {
      display: flex; flex-direction: column; align-items: center;
      background: #f8f7f6; padding: 1.2rem; border-radius: 24px;
    }
    .qrcode-section p {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.03em; color: #6f6f6f; margin-bottom: 0.5rem;
    }
    #qrcode-container {
      display: flex; justify-content: center; align-items: center;
      background: white; padding: 0.75rem; border-radius: 16px;
    }
    #qrcode-container canvas,
    #qrcode-container img { display: block; width: 140px; height: 140px; }
    .qr-hint {
      font-size: 0.7rem; color: #8b8b8b; margin-top: 0.6rem;
      text-align: center; word-break: break-all;
    }

    /* ---------- CARD DETALHADO ---------- */
    .card-section {
      background: white;
      border-radius: 28px;
      padding: 1.2rem;
      margin-top: 0.5rem;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0efed;
    }

    .card-hair-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 22px;
      background: #eae8e6;
      margin-bottom: 1rem;
    }

    .card-hair-name {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .card-hair-desc {
      font-size: 0.9rem;
      color: #5a5a5a;
      margin-bottom: 1.2rem;
    }

    /* BOTÃO ÚNICO */
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 60px;
      border: none;
      background: #2b5f8a;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.6rem;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-action:hover { background: #1f4a6e; }
    .btn-action:active { transform: scale(0.98); }
    .btn-action.fase2 { background: #1e1e1e; }
    .btn-action.fase2:hover { background: #333; }

    /* Aviso fase 1 (após 1º clique) */
    .aviso-fase1 {
      background: #e6f7ec;
      border: 1px solid #a8e6bf;
      color: #0a5c2a;
      font-size: 0.85rem;
      padding: 0.9rem 1rem;
      border-radius: 16px;
      margin-bottom: 1rem;
      line-height: 1.5;
      text-align: center;
    }
    .aviso-fase1 strong { display: block; margin-bottom: 0.2rem; }

    /* Área fase 2 (imagem + prompt + instruções) */
    .fase2-area {
      margin-bottom: 1rem;
    }

    .fase2-titulo {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b8b8b;
      margin: 1.2rem 0 0.5rem;
      font-weight: 600;
      text-align: center;
    }

    .fase2-img-wrap {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1rem;
      background: #eae8e6;
    }

    .fase2-img-wrap img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .fase2-img-hint {
      text-align: center;
      font-size: 0.75rem;
      color: #6b6b6b;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      font-style: italic;
    }

    /* Prompt */
    .prompt-box {
      background: #f6f5f4;
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: #2c2c2c;
      border: 1px solid #e6e4e2;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.5;
      max-height: 240px;
      overflow-y: auto;
    }

    /* Instruções */
    .instructions {
      background: #f8f7f6;
      border-radius: 20px;
      padding: 1rem 1rem 1rem 1.2rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      counter-reset: step;
    }
    .instructions li {
      list-style: none;
      margin-bottom: 0.5rem;
      padding-left: 1.8rem;
      position: relative;
      counter-increment: step;
    }
    .instructions li:last-child { margin-bottom: 0; }
    .instructions li::before {
      content: counter(step);
      position: absolute; left: 0; top: 0;
      width: 1.3rem; height: 1.3rem;
      background: #1e1e1e; color: white;
      border-radius: 40px; font-size: 0.7rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }

    /* Fallback cópia manual */
    .aviso-fallback {
      background: #fff4e5;
      border: 1px solid #ffd9a0;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .aviso-fallback div {
      font-size: 0.8rem;
      color: #7a4a00;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .aviso-fallback textarea {
      width: 100%;
      height: 120px;
      font-size: 0.72rem;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px solid #e0c89a;
      font-family: monospace;
      resize: none;
    }

    /* Produtos */
    .products-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8b8b8b;
      margin: 1rem 0 0.6rem;
      font-weight: 600;
      text-align: center;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0.4rem;
      border-bottom: 1px solid #f0efed;
      text-decoration: none;
      color: inherit;
    }
    .product-item:last-child { border-bottom: none; }
    .product-info h4 { font-size: 0.92rem; font-weight: 500; }
    .product-info p { font-size: 0.75rem; color: #8b8b8b; margin-top: 0.1rem; }
    .product-link-icon {
      font-size: 1rem;
      background: #f0efed;
      width: 34px; height: 34px; border-radius: 40px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: #1e1e1e;
    }

    .hidden { display: none !important; }
    .footer-note { margin-top: 1.5rem; font-size: 0.7rem; color: #aaa; text-align: center; }

    .btn-voltar {
      display: inline-block;
      font-size: 0.85rem;
      color: #6b6b6b;
      text-decoration: none;
      margin-bottom: 1rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0.3rem 0;
      font-family: inherit;
    }
    .btn-voltar:hover { color: #1e1e1e; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>HairOS</h1>
      <p>referência · QR · simulação IA</p>
    </header>

    <div class="gallery" id="gallery"></div>
    <div id="card-area" class="hidden"></div>

    <!-- MODAL QR -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-content">
        <button class="modal-close" id="modalCloseBtn">×</button>
        <img class="modal-hair-img" id="modalHairImg" src="" alt="Cabelo">
        <h3 class="modal-hair-name" id="modalHairName"></h3>
        <p class="modal-hair-desc" id="modalHairDesc"></p>
        <div class="qrcode-section">
          <p>📱 aponte a câmera</p>
          <div id="qrcode-container"></div>
          <div class="qr-hint" id="qrHint"></div>
        </div>
      </div>
    </div>

    <div class="footer-note">protótipo · 3 cabelos · estrutura expansível</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    // ============================================================
    // CONFIGURAÇÃO OPCIONAL DE URL PÚBLICA
    // ============================================================
    const URL_PUBLICA_MANUAL = '';

    // ============================================================
    // DADOS DOS CABELOS
    // ============================================================
    const HAIRS = [
      {
        id: '01',
        nome: 'Iluminado Caramelo',
        imagem: 'https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=800&auto=format&fit=crop&q=80',
        descricao: 'Mechas iluminadas tom caramelo, ondas suaves e movimento natural.',
        prompt: `Você vai receber DUAS imagens nesta conversa:

IMAGEM 1: foto de uma pessoa (a cliente).
IMAGEM 2: imagem de referência de um cabelo iluminado caramelo com ondas suaves.

Sua tarefa: aplicar o cabelo da IMAGEM 2 na pessoa da IMAGEM 1, gerando uma simulação fotorrealista.

Regras obrigatórias:
- Preserve rigorosamente o rosto, a identidade, as características faciais, as proporções e a expressão da pessoa da IMAGEM 1.
- Mantenha a iluminação, o tom de pele e o fundo originais da IMAGEM 1.
- Aplique o cabelo da IMAGEM 2 respeitando a textura ondulada, o caimento, o tom caramelo iluminado e o volume originais.
- O resultado deve parecer uma FOTO REAL, nunca uma montagem, peruca ou colagem artificial.
- Integre o cabelo naturalmente com o couro cabeludo e a pele, com sombras e transições suaves.
- Não altere roupas, expressão, fundo ou qualquer outro elemento da IMAGEM 1.
- A saída deve ser uma única imagem fotorrealista e natural.

Se as duas imagens não forem enviadas, peça ao usuário para anexá-las antes de gerar o resultado.`,
        produtos: [
          { nome: 'Máscara de hidratação intensa', desc: 'Para cabelos com mechas', link: 'https://mercadolivre.com.br' },
          { nome: 'Sérum anti-frizz', desc: 'Finalizador leve', link: 'https://mercadolivre.com.br' },
          { nome: 'Protetor térmico', desc: 'Essencial antes do secador', link: 'https://mercadolivre.com.br' }
        ]
      },
      {
        id: '02',
        nome: 'Preto Cacheado',
        imagem: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop&q=80',
        descricao: 'Cachos definidos, volume equilibrado e brilho natural.',
        prompt: `Você vai receber DUAS imagens nesta conversa:

IMAGEM 1: foto de uma pessoa (a cliente).
IMAGEM 2: imagem de referência de um cabelo preto cacheado com definição.

Sua tarefa: aplicar o cabelo da IMAGEM 2 na pessoa da IMAGEM 1, gerando uma simulação fotorrealista.

Regras obrigatórias:
- Preserve rigorosamente o rosto, a identidade, as características faciais, as proporções e a expressão da pessoa da IMAGEM 1.
- Mantenha a iluminação, o tom de pele e o fundo originais da IMAGEM 1.
- Aplique o cabelo da IMAGEM 2 respeitando a textura dos cachos, o volume equilibrado, o brilho natural e a cor preta originais.
- O resultado deve parecer uma FOTO REAL, nunca uma montagem, peruca ou colagem artificial.
- Integre o cabelo naturalmente com o couro cabeludo e a pele, com sombras e transições suaves.
- Não altere roupas, expressão, fundo ou qualquer outro elemento da IMAGEM 1.
- A saída deve ser uma única imagem fotorrealista e natural.

Se as duas imagens não forem enviadas, peça ao usuário para anexá-las antes de gerar o resultado.`,
        produtos: [
          { nome: 'Creme de pentear', desc: 'Definição de cachos', link: 'https://mercadolivre.com.br' },
          { nome: 'Gelatina modeladora', desc: 'Fixação sem endurecer', link: 'https://mercadolivre.com.br' },
          { nome: 'Óleo de argan', desc: 'Brilho e nutrição', link: 'https://mercadolivre.com.br' }
        ]
      },
      {
        id: '03',
        nome: 'Loiro Platinado',
        imagem: 'https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=800&auto=format&fit=crop&q=80',
        descricao: 'Loiro platinado liso, com brilho espelhado e raiz esfumada.',
        prompt: `Você vai receber DUAS imagens nesta conversa:

IMAGEM 1: foto de uma pessoa (a cliente).
IMAGEM 2: imagem de referência de um cabelo loiro platinado liso com raiz esfumada.

Sua tarefa: aplicar o cabelo da IMAGEM 2 na pessoa da IMAGEM 1, gerando uma simulação fotorrealista.

Regras obrigatórias:
- Preserve rigorosamente o rosto, a identidade, as características faciais, as proporções e a expressão da pessoa da IMAGEM 1.
- Mantenha a iluminação, o tom de pele e o fundo originais da IMAGEM 1.
- Aplique o cabelo da IMAGEM 2 respeitando a textura lisa, o brilho espelhado, a cor platinada e a raiz esfumada originais.
- O resultado deve parecer uma FOTO REAL, nunca uma montagem, peruca ou colagem artificial.
- Integre o cabelo naturalmente com o couro cabeludo e a pele, com sombras e transições suaves.
- Não altere roupas, expressão, fundo ou qualquer outro elemento da IMAGEM 1.
- A saída deve ser uma única imagem fotorrealista e natural.

Se as duas imagens não forem enviadas, peça ao usuário para anexá-las antes de gerar o resultado.`,
        produtos: [
          { nome: 'Shampoo matizador', desc: 'Neutraliza amarelo', link: 'https://mercadolivre.com.br' },
          { nome: 'Máscara de reconstrução', desc: 'Para cabelos descoloridos', link: 'https://mercadolivre.com.br' },
          { nome: 'Leave-in térmico', desc: 'Proteção e brilho', link: 'https://mercadolivre.com.br' }
        ]
      }
    ];

    // ============================================================
    // REFERÊNCIAS DOM
    // ============================================================
    const galleryEl = document.getElementById('gallery');
    const cardArea = document.getElementById('card-area');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalHairImg = document.getElementById('modalHairImg');
    const modalHairName = document.getElementById('modalHairName');
    const modalHairDesc = document.getElementById('modalHairDesc');
    const qrcodeContainer = document.getElementById('qrcode-container');
    const qrHint = document.getElementById('qrHint');

    // ============================================================
    // URL BASE
    // ============================================================
    function getBaseUrl() {
      if (URL_PUBLICA_MANUAL && URL_PUBLICA_MANUAL.trim() !== '') {
        return URL_PUBLICA_MANUAL.split('?')[0];
      }
      if (window.location.protocol === 'file:') {
        return window.location.href.split('?')[0];
      }
      return window.location.origin + window.location.pathname;
    }

    function buildHairUrl(hairId) {
      return `${getBaseUrl()}?cabelo=${hairId}`;
    }

    function getHairById(id) {
      return HAIRS.find(h => h.id === id);
    }

    // ============================================================
    // GALERIA
    // ============================================================
    function renderGallery() {
      galleryEl.innerHTML = HAIRS.map(hair => `
        <div class="hair-card" data-hair-id="${hair.id}">
          <img src="${hair.imagem}" alt="${hair.nome}" loading="lazy">
          <div class="hair-card-info">
            <h2>${hair.nome}</h2>
            <p>${hair.descricao}</p>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.hair-card').forEach(card => {
        card.addEventListener('click', () => {
          const hair = getHairById(card.dataset.hairId);
          if (hair) openModal(hair);
        });
      });
    }

    // ============================================================
    // MODAL QR
    // ============================================================
    function openModal(hair) {
      modalHairImg.src = hair.imagem;
      modalHairImg.alt = hair.nome;
      modalHairName.textContent = hair.nome;
      modalHairDesc.textContent = hair.descricao;
      renderQRCode(hair.id);
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      qrcodeContainer.innerHTML = '';
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // ============================================================
    // QR CODE
    // ============================================================
    function renderQRCode(hairId) {
      qrcodeContainer.innerHTML = '';
      const url = buildHairUrl(hairId);
      qrHint.textContent = url;

      if (typeof QRCode === 'undefined') {
        qrcodeContainer.innerHTML = `
          <a href="${url}" target="_blank" style="font-size:0.8rem; color:#1e1e1e;">
            🔗 abrir link
          </a>`;
        return;
      }

      try {
        new QRCode(qrcodeContainer, {
          text: url,
          width: 140,
          height: 140,
          colorDark: '#1e1e1e',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (err) {
        console.warn('Erro QR:', err);
        qrcodeContainer.innerHTML = `<a href="${url}" target="_blank">🔗 abrir</a>`;
      }
    }

    // ============================================================
    // CARD DETALHADO (após scan) — FLUXO DE 2 FASES
    // ============================================================
    function renderHairCard(hair) {
      galleryEl.classList.add('hidden');

      const productsHtml = hair.produtos.map(prod => `
        <a class="product-item" href="${prod.link}" target="_blank" rel="noopener noreferrer">
          <div class="product-info">
            <h4>${prod.nome}</h4>
            <p>${prod.desc}</p>
          </div>
          <div class="product-link-icon">↗</div>
        </a>
      `).join('');

      cardArea.innerHTML = `
        <button class="btn-voltar" onclick="window.location.href='${getBaseUrl()}'">
          ← voltar
        </button>

        <div class="card-section">
          <img class="card-hair-img" src="${hair.imagem}" alt="${hair.nome}">
          <h2 class="card-hair-name">${hair.nome}</h2>
          <p class="card-hair-desc">${hair.descricao}</p>

          <!-- BOTÃO ÚNICO (2 FASES) -->
          <button class="btn-action" id="acaoBtn">
            🚀 Preparar simulação com IA
          </button>

          <!-- ÁREA DE CONTEÚDO (muda conforme a fase) -->
          <div id="conteudoArea"></div>

          <!-- PRODUTOS -->
          <div class="products-title">produtos recomendados</div>
          ${productsHtml}
        </div>
      `;

      cardArea.classList.remove('hidden');

      // ============================================================
      // ESTADO DAS FASES
      // ============================================================
      let fase = 1; // 1 = pronto pra preparar | 2 = mostrando conteúdo

      const acaoBtn = document.getElementById('acaoBtn');
      const conteudoArea = document.getElementById('conteudoArea');

      acaoBtn.addEventListener('click', async () => {
        // ============================================================
        // FASE 1 → copia prompt + abre Gemini + mostra aviso
        // ============================================================
        if (fase === 1) {
          console.log('🚀 FASE 1: copiando prompt e abrindo Gemini');

          // 1) Copiar prompt
          let promptOk = false;
          try {
            await navigator.clipboard.writeText(hair.prompt);
            promptOk = true;
          } catch (err) {
            console.warn('Clipboard falhou:', err);
          }

          // 2) Abrir Gemini (site — funciona mesmo sem app)
          try {
            window.open('https://gemini.google.com', '_blank');
          } catch (err) {
            console.warn('window.open bloqueado:', err);
          }

          // 3) Mostrar aviso fase 1
          conteudoArea.innerHTML = `
            <div class="aviso-fase1">
              <strong>✅ Prompt copiado!</strong>
              ${promptOk ? '' : '⚠️ Se não copiou, toque abaixo para ver o texto.<br>'}
              ✨ O Gemini está abrindo em outra aba...
            </div>
            ${!promptOk ? `
              <div class="aviso-fallback">
                <div>Copie o prompt manualmente:</div>
                <textarea readonly>${hair.prompt}</textarea>
              </div>
            ` : ''}
          `;

          // 4) Mudar botão para fase 2
          acaoBtn.textContent = '👁️ Ver prompt + imagem';
          acaoBtn.classList.add('fase2');
          fase = 2;
          return;
        }

        // ============================================================
        // FASE 2 → mostra imagem + prompt + instruções
        // ============================================================
        if (fase === 2) {
          console.log('👁️ FASE 2: mostrando imagem + prompt + instruções');

          conteudoArea.innerHTML = `
            <div class="fase2-area">

              <div class="aviso-fase1" style="background:#e6f7ec;">
                <strong>✅ Prompt já foi copiado</strong>
                O Gemini está aberto em outra aba. Agora salve a imagem abaixo.
              </div>

              <div class="fase2-titulo">imagem do cabelo</div>
              <div class="fase2-img-wrap">
                <img src="${hair.imagem}" alt="${hair.nome}">
              </div>
              <div class="fase2-img-hint">
                👆 toque e segure na imagem para salvar<br>
                ou tire um print da tela
              </div>

              <div class="fase2-titulo">prompt</div>
              <div class="prompt-box">${hair.prompt}</div>

              <div class="fase2-titulo">instruções</div>
              <div class="instructions">
                <li>Copie o prompt (já foi copiado).</li>
                <li>Abra o Gemini (já está aberto).</li>
                <li>Envie <strong>sua foto</strong>.</li>
                <li>Envie <strong>a imagem do cabelo</strong> acima.</li>
                <li>Cole o prompt.</li>
                <li>Gere sua simulação.</li>
              </div>

            </div>
          `;

          // Mudar botão para "preparar novamente"
          acaoBtn.textContent = '🔄 Preparar novamente';
          acaoBtn.classList.remove('fase2');
          fase = 1;
          return;
        }
      });
    }

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    function init() {
      const params = new URLSearchParams(window.location.search);
      const hairId = params.get('cabelo');

      if (hairId) {
        const hair = getHairById(hairId);
        if (hair) {
          renderHairCard(hair);
          document.title = `${hair.nome} · HairOS`;
        } else {
          renderGallery();
          const aviso = document.createElement('p');
          aviso.style.cssText = 'text-align:center; color:#b33; margin-top:1rem;';
          aviso.textContent = 'Cabelo não encontrado. Selecione um da galeria.';
          cardArea.appendChild(aviso);
          cardArea.classList.remove('hidden');
        }
      } else {
        renderGallery();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
